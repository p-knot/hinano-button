<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>ボイスエディター - こんひな〜</title>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PHSZQLYJX8');

  <meta name="format-detection" content="telephone=no">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .editor-layout{max-width:1000px;margin:0 auto;padding:1.2rem 1rem 3rem;display:grid;grid-template-columns:260px 1fr;gap:1.2rem;position:relative;z-index:1}
    .side-panel{display:flex;flex-direction:column;gap:1rem;max-height:calc(100vh - var(--header-height) - 3rem)}
    .side-card{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid rgba(212,168,124,.12);overflow:hidden;display:flex;flex-direction:column}
    .side-card-header{padding:.7rem .9rem;font-size:.8rem;font-weight:900;border-bottom:1px solid rgba(212,168,124,.15);background:linear-gradient(135deg,rgba(252,231,243,.3),var(--bg-card))}
    .side-card-body{flex:1;overflow-y:auto;padding:.4rem;max-height:35vh}
    .side-card-body::-webkit-scrollbar{width:4px}
    .side-card-body::-webkit-scrollbar-thumb{background:var(--choco-milk);border-radius:2px}
    .voice-select-btn{display:block;width:100%;padding:.5rem .7rem;border:none;border-radius:var(--radius);background:none;text-align:left;font-family:inherit;cursor:pointer;transition:background .15s}
    .voice-select-btn:hover{background:var(--pink-100)}
    .voice-select-btn span:first-child{display:block;font-size:.8rem;font-weight:700;color:var(--text)}
    .voice-select-movie{display:block;font-size:.6rem;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .saved-item{display:flex;align-items:center;gap:.4rem;padding:.5rem .7rem;border-radius:var(--radius);transition:background .15s}
    .saved-item:hover{background:var(--pink-100)}
    .saved-item-name{flex:1;font-size:.78rem;font-weight:700;color:var(--text)}
    .saved-item-source{font-size:.6rem;color:var(--text-light)}
    .saved-item-actions{display:flex;gap:.2rem}
    .saved-item-actions button{width:24px;height:24px;border:none;border-radius:50%;background:rgba(92,58,46,.08);color:var(--text-sub);font-size:.65rem;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center}
    .saved-item-actions button:hover{background:var(--pink-200);color:var(--pink-600)}
    .saved-empty{text-align:center;padding:1.5rem .5rem;color:var(--text-light);font-size:.75rem}
    .editor-main{background:var(--bg-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);border:1px solid rgba(212,168,124,.12);padding:1.2rem;display:flex;flex-direction:column;gap:1rem}
    .editor-header{display:flex;align-items:center;gap:.8rem}
    .editor-title{font-size:1rem;font-weight:900;flex:1}
    .editor-status{font-size:.7rem;color:var(--text-light)}
    .waveform-wrap{background:var(--bg);border-radius:var(--radius);border:1px solid rgba(212,168,124,.12);overflow:hidden;position:relative}
    #waveformCanvas{width:100%;height:100px;display:block;cursor:default}
    .waveform-hint{position:absolute;bottom:4px;right:8px;font-size:.6rem;color:var(--text-light);pointer-events:none}
    .trim-row{display:flex;gap:.6rem;align-items:center}
    .trim-row label{font-size:.7rem;font-weight:700;color:var(--text-sub);min-width:35px}
    .trim-row input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--pink-200);outline:none}
    .trim-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--pink-500);cursor:pointer}
    .trim-row input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--pink-500);cursor:pointer;border:none}
    .trim-row .ctrl-value{font-size:.7rem;color:var(--text-light);min-width:35px;text-align:right}
    .editor-controls{display:flex;flex-direction:column;gap:.8rem}
    .ctrl-group{display:grid;grid-template-columns:100px 1fr auto;gap:.5rem;align-items:center;padding:.5rem .7rem;background:var(--bg);border-radius:var(--radius)}
    .ctrl-label{font-size:.75rem;font-weight:700;color:var(--text-sub)}
    .ctrl-value{font-size:.7rem;color:var(--text-light);text-align:right;min-width:50px}
    .toggle-btn{width:44px;height:24px;border:none;border-radius:12px;background:var(--choco-milk);cursor:pointer;position:relative;transition:background .2s}
    .toggle-btn::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s}
    .toggle-btn.is-on{background:var(--pink-500)}
    .toggle-btn.is-on::after{transform:translateX(20px)}
    .editor-controls input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--pink-200);outline:none;width:100%}
    .editor-controls input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--pink-500);cursor:pointer;box-shadow:0 1px 3px rgba(219,39,119,.3)}
    .editor-controls input[type=range]:disabled{opacity:.3}
    .editor-controls input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--pink-500);cursor:pointer;border:none}
    .editor-controls select{padding:.3rem .5rem;border:2px solid var(--choco-milk);border-radius:8px;font-family:inherit;font-size:.75rem;background:var(--bg-card);color:var(--text);outline:none;cursor:pointer}
    .editor-actions{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
    .btn-play,.btn-reset,.btn-save{padding:.6rem 1.2rem;border:none;border-radius:50px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s}
    .btn-play{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));color:#fff;box-shadow:var(--shadow-sm)}
    .btn-play:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
    .btn-play.playing{background:linear-gradient(135deg,var(--choco),var(--choco-light))}
    .btn-reset{background:var(--bg);color:var(--text-sub);border:2px solid var(--choco-milk)}
    .btn-reset:hover{border-color:var(--pink-400);color:var(--pink-600)}
    .save-row{display:flex;gap:.5rem;align-items:center;flex:1}
    .save-row input[type=text]{flex:1;padding:.5rem .8rem;border:2px solid var(--choco-milk);border-radius:50px;font-family:inherit;font-size:.8rem;background:var(--bg);color:var(--text);outline:none}
    .save-row input[type=text]:focus{border-color:var(--pink-400)}
    .save-row input[type=text]::placeholder{color:var(--text-light)}
    .btn-save{background:linear-gradient(135deg,var(--choco),var(--choco-light));color:#fff;flex-shrink:0}
    .btn-save:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
    @media(max-width:700px){.editor-layout{grid-template-columns:1fr}.side-panel{max-height:none;flex-direction:row;gap:.8rem}.side-card{flex:1}.side-card-body{max-height:25vh}.ctrl-group{grid-template-columns:80px 1fr auto}.nav-brand{font-size:1.8rem}.nav-link span{display:none}.nav-link{padding:.5rem}.nav-link svg{width:20px;height:20px}.volume-slider{width:50px}}
    @media(max-width:480px){.side-panel{flex-direction:column}.editor-actions{flex-direction:column}.save-row{width:100%}}
  </style>
</head>
<body>
  <div class="bg-deco bg-deco-1"></div>
  <div class="bg-deco bg-deco-2"></div>
  <div class="bg-deco bg-deco-3"></div>
  <div class="bg-deco bg-deco-4"></div>

      <a href="editor.html" class="nav-link is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>エディター</span></a>
      <a href="recorder.html" class="nav-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg><span>レコーダー</span></a>

    <div class="volume-control">
      <svg class="volume-icon" id="volumeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
    </div>
  </nav>

  <div class="editor-layout">
    <div class="side-panel">
      <div class="side-card">
        <div class="side-card-header">♥ お気に入りから選択</div>
        <div class="side-card-body" id="voiceSelectorList"></div>
      </div>
      <div class="side-card">
        <div class="side-card-header">💾 保存済みボイス</div>
        <div class="side-card-body" id="savedList"></div>
      </div>
    </div>

    <div class="editor-main">
      <div class="editor-header">
        <h2 class="editor-title" id="editorTitle">ボイスを選んでね</h2>
        <span class="editor-status" id="editorStatus"></span>
      </div>

      <div class="waveform-wrap">
        <canvas id="waveformCanvas"></canvas>
        <span class="waveform-hint">◀▶ ハンドルをドラッグしてトリム</span>
      </div>

      <div class="trim-row">
        <label>開始</label>
        <input type="range" id="trimStart" min="0" max="99" value="0" step="1" disabled>
        <span class="ctrl-value" id="trimStartVal">0%</span>
        <label>終了</label>
        <input type="range" id="trimEnd" min="1" max="100" value="100" step="1" disabled>
        <span class="ctrl-value" id="trimEndVal">100%</span>
      </div>

      <div class="editor-controls">
        <div class="ctrl-group"><span class="ctrl-label">音量</span><input type="range" id="volumeRange" min="0" max="200" value="100" disabled><span class="ctrl-value" id="volumeVal">100%</span></div>
        <div class="ctrl-group"><span class="ctrl-label">ピッチ/速度</span><input type="range" id="pitchRange" min="25" max="200" value="100" disabled><span class="ctrl-value" id="pitchVal">1.00x</span></div>
        <div class="ctrl-group"><span class="ctrl-label">逆再生</span><div></div><button class="toggle-btn" id="reverseToggle" disabled></button></div>
        <div class="ctrl-group"><span class="ctrl-label">リバーブ</span><input type="range" id="reverbRange" min="0" max="100" value="50" disabled><button class="toggle-btn" id="reverbToggle" disabled></button></div>
        <div class="ctrl-group"><span class="ctrl-label">ディレイ</span><input type="range" id="delayTimeRange" min="5" max="100" value="30" disabled><button class="toggle-btn" id="delayToggle" disabled></button></div>
        <div class="ctrl-group"><span class="ctrl-label" style="font-size:.65rem">└ フィードバック</span><input type="range" id="delayFbRange" min="0" max="90" value="40" disabled><span class="ctrl-value"></span></div>
        <div class="ctrl-group"><span class="ctrl-label">ディストーション</span><input type="range" id="distRange" min="0" max="100" value="50" disabled><button class="toggle-btn" id="distToggle" disabled></button></div>
        <div class="ctrl-group"><span class="ctrl-label">フィルター</span><select id="filterSelect" disabled><option value="off">OFF</option><option value="lowpass">ローパス</option><option value="highpass">ハイパス</option></select><span class="ctrl-value"></span></div>
        <div class="ctrl-group"><span class="ctrl-label" style="font-size:.65rem">└ 周波数</span><input type="range" id="filterFreqRange" min="100" max="8000" value="1000" disabled><span class="ctrl-value" id="filterFreqVal">1000Hz</span></div>
      </div>

      <div class="editor-actions">
        <button class="btn-play" id="playBtn" disabled>▶ プレビュー</button>
        <button class="btn-reset" id="resetBtn" disabled>リセット</button>
        <div class="save-row">
          <input type="text" id="saveName" placeholder="保存名を入力..." disabled>
          <button class="btn-save" id="saveBtn" disabled>保存</button>
        </div>
      </div>
    </div>
  </div>

</body>
